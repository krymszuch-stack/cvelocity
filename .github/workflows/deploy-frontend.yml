name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never let two deploys race for the live channel.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Verify VITE_API_BASE_URL Variable
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "ERROR: vars.VITE_API_BASE_URL is not configured in GitHub Repository Variables!"
            exit 1
          fi

      # build:client only — the server belongs on Render, and building it here
      # would put server.cjs back into dist/, which Firebase publishes.
      - name: Build Frontend
        run: npm run build:client
        env:
          NODE_ENV: production
          # Public URL, not a secret — stored as a repo variable.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: skillvault-99a72
