name: SkillVault CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check (TypeScript)
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm test

      # Reporting only for now: a transitive advisory in a devDependency should
      # surface, not block every merge. Tighten to a hard gate once triaged.
      - name: Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build SkillVault App & Server
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
