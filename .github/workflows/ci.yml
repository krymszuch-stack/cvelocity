name: CVELOCITY CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Ta sama wersja co obraz produkcyjny (Dockerfile) i co środowisko,
        # w którym weryfikowano przypinanie IP w safeFetch.
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Client and Server
        run: npm run build

      # Do tej pory CI budowało bundel serwera i nigdy nie próbowało go
      # uruchomić. Przez to `import.meta.url` skompilowane do pustego obiektu
      # (bundel CJS) przechodziło przez tsc, lint i wszystkie testy jednostkowe,
      # a wywracało się dopiero przy starcie kontenera.
      - name: Production Boot Smoke Test
        env:
          NODE_ENV: production
          PORT: 8099
          GEMINI_API_KEY: dummy-key-for-boot-test
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf -m 2 "http://localhost:8099/api/health" > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -sf -m 5 "http://localhost:8099/api/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          # Bundel serwera i jego source mapa leżą w dist/, frontend w dist/client/.
          # Gdyby kiedyś znów trafiły do jednego katalogu, express.static wystawiłby
          # kod serwerowy publicznie — ten test to wykryje.
          if curl -sf -m 5 "http://localhost:8099/server.mjs.map" | grep -q "safeFetch"; then
            echo "BŁĄD: source mapa serwera jest publicznie dostępna" >&2
            kill $SERVER_PID
            exit 1
          fi

          # Frontend jest serwowany z tego samego kontenera co API. Gdyby build
          # klienta wypadł z `npm run build`, ten krok to wychwyci — bez niego
          # obraz wstawałby poprawnie i oddawał 404 na stronie głównej.
          test "$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8099/)" = "200"

          # Trasy kont są zarejestrowane zawsze. W trybie lokalnym (domyślnym)
          # odpowiadają 501 "ta instalacja nie prowadzi kont", a nie 404 nie do
          # odróżnienia od literówki w adresie.
          test "$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8099/api/me)" = "501"

          kill $SERVER_PID

      - name: Auth Boundary Smoke Test
        env:
          NODE_ENV: production
          PORT: 8098
          GEMINI_API_KEY: dummy-key-for-boot-test
          BACKEND_MODE: cloud
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-boot-test
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf -m 2 "http://localhost:8098/api/health" > /dev/null; then
              break
            fi
            sleep 1
          done

          # Z włączonym backendem żądanie bez tokenu musi zostać odrzucone,
          # zanim dotknie bazy. Ten test broni granicy uwierzytelnienia: gdyby
          # requireAuth kiedykolwiek przepuścił żądanie bez nagłówka
          # Authorization, trasy vaultu i aplikacji wystawiłyby cudze dane.
          for path in me vault applications; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://localhost:8098/api/$path")
            if [ "$code" != "401" ]; then
              echo "BŁĄD: /api/$path bez tokenu zwróciło $code zamiast 401" >&2
              kill $SERVER_PID
              exit 1
            fi
          done

          kill $SERVER_PID

      - name: Secrets Must Not Reach The Browser Bundle
        run: |
          # Pozycja z checklisty w docs/SETUP.md, tutaj jako krok automatyczny —
          # żeby nie dało się jej pominąć przez zapomnienie. Klucz service_role
          # omija całe RLS, więc w pakiecie przeglądarki oznaczałby pełny dostęp
          # do bazy dla każdego odwiedzającego.
          if grep -rE "service_role|sk_live_|sk_test_|SUPABASE_SERVICE_ROLE" dist/client/; then
            echo "BŁĄD: sekret trafił do pakietu przeglądarki" >&2
            exit 1
          fi
          echo "✓ brak sekretów w dist/client/"

      - name: Build Container Image
        run: docker build -t cvelocity-api:ci .
