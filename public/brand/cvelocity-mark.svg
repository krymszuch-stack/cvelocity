<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -160 440 320" width="100%" height="100%" fill="none">
  <defs>
    <mask id="cvel-mask" maskUnits="userSpaceOnUse" x="-300" y="-300" width="600" height="600">
      <rect x="-300" y="-300" width="600" height="600" fill="#ffffff"/>
      <g fill="none" stroke="#000000" stroke-width="31" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10">
        <path d="M 20 -75 L 110 0 L 20 75"/>
      </g>
    </mask>
  </defs>
  <g transform="skewX(-10)">
    <!-- Łuk C (Vault Loop) -->
    <g mask="url(#cvel-mask)" stroke="#1E3A5F" stroke-width="17" stroke-linecap="round" stroke-linejoin="miter">
      <path d="M 30 -75 A 80 80 0 1 0 30 75"/>
      <path d="M -25 -52 A 55 55 0 1 0 -25 52"/>
    </g>
    <!-- Wektor prędkości V (Supersonic Shockwave) -->
    <g stroke="#F26440" stroke-width="17" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10">
      <path d="M 20 -75 L 110 0 L 20 75"/>
      <path d="M 75 -75 L 165 0 L 75 75" opacity="0.85"/>
    </g>
    <!-- Linie pędu (Speed Streaks) -->
    <g stroke="#1E3A5F" stroke-width="6" stroke-linecap="round" opacity="0.25">
      <line x1="-165" y1="-28" x2="-115" y2="-28"/>
      <line x1="-185" y1="0" x2="-125" y2="0"/>
      <line x1="-165" y1="28" x2="-115" y2="28"/>
    </g>
  </g>
</svg>