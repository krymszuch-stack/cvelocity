    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CVelocity – edycja i dopasowanie CV pod filtry ATS, przygotowanie do rozmowy i śledzenie aplikacji. Tryb lokalny: dane zostają w Twojej przeglądarce." />
    <title>CVelocity – CV pod ATS i rozmowa o pracę</title>
    <meta property="og:title" content="CVelocity – CV pod ATS i rozmowa o pracę" />
    <meta property="og:description" content="CVelocity – edycja i dopasowanie CV pod filtry ATS, przygotowanie do rozmowy i śledzenie aplikacji. Tryb lokalny: dane zostają w Twojej przeglądarce." />

    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body class="bg-surface text-ink antialiased font-sans selection:bg-brand-200">
    <script>
      // Apply the saved theme before first paint. Without this the document renders
      // with the dark default above and then snaps to light after hydration.
      (function () {
        try {
          var stored = localStorage.getItem('cvelocity-theme');
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : stored === 'system' || !stored
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : 'dark';
          // No stored preference at all means the dark-first default wins.
          if (!stored) resolved = 'dark';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.classList.toggle('dark', resolved === 'dark');
        } catch (e) {
          /* localStorage unavailable (private mode) — keep the dark default */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
